<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b67"><title>Records · Dice Game</title><link rel="stylesheet" href="style.css"></head><body><header class="subHeader"><div class="brand"><h1>Dice Game</h1><small>Created by: L</small></div><nav><a class="navBtn" href="index.html">Game</a><a class="navBtn" href="games.html">Games</a></nav></header><main><h2>Top 10 Records</h2><ol id="recordsList" class="recordsPage"><li>Loading…</li></ol><h2>Vs Computer</h2><div id="computerStats" class="historyCard">Loading…</div></main><script>fetch("api/game.php?action=records").then(r=>r.json()).then(j=>{const e=document.getElementById("recordsList");if(!j.ok||!j.records.length){e.innerHTML="<li>No records yet.</li>";return}e.innerHTML=j.records.map(x=>"<li><b>"+esc(x.name)+"</b><span>"+Number(x.score)+" points</span></li>").join("")}).catch(()=>recordsList.innerHTML="<li>Could not load records.</li>");function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}fetch("api/game.php?action=computer-stats").then(r=>r.json()).then(j=>{let s=j.stats;computerStats.innerHTML="Games: <b>"+s.games+"</b> · Wins: <b>"+s.wins+"</b> · Losses: <b>"+s.losses+"</b> · Draws: <b>"+s.draws+"</b> · Win rate: <b>"+s.win_rate+"%</b><br>Best human: "+s.human_best+" · Best computer: "+s.computer_best}).catch(()=>computerStats.textContent="No computer statistics yet.");</script></body></html>
