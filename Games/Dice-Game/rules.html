<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dice Game – Rules</title><link rel="stylesheet" href="style.css"><style>.rules{max-width:850px;margin:auto;padding:12px}.rulesTop{display:flex;justify-content:space-between;gap:8px;align-items:center}.rule{background:#fff;border-radius:10px;padding:12px;margin:10px 0}.examples{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.rules .die-svg{width:48px!important;height:48px!important}.dark .rule{background:#1f2937}.back{display:inline-block;padding:8px 12px;border-radius:8px;background:#173b67;color:#fff;text-decoration:none}.rule h2{margin:0 0 5px}.rule p{margin:5px 0;line-height:1.45}</style></head><body><main class="rules"><div class="rulesTop"><a class="back" href="index.html" id="back">← Back to game</a><div><button id="en">EN</button><button id="th">ไทย</button></div></div><h1 id="title">Dice Game – How to play</h1><div id="content"></div></main><script>
const P={1:[[20,20]],2:[[11,11],[29,29]],3:[[11,11],[20,20],[29,29]],4:[[11,11],[29,11],[11,29],[29,29]],5:[[11,11],[29,11],[20,20],[11,29],[29,29]],6:[[11,10],[29,10],[11,20],[29,20],[11,30],[29,30]]};function die(n){return '<svg class="die-svg" viewBox="0 0 40 40"><rect x="1.5" y="1.5" width="37" height="37" rx="7" fill="#e5e7eb" stroke="#94a3b8" stroke-width="2"/>'+P[n].map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.7" fill="#111827"/>').join('')+'</svg>'}function ds(a){return '<div class="examples">'+a.map(die).join('')+'</div>'}
const R={en:{title:"Dice Game – How to play",back:"← Back to game",intro:["Goal","Score as many points as possible. On your turn you may roll five dice up to three times. After each roll you may keep any dice and roll the others again. Then choose exactly one free scoring category."],upper:["Numbers 1–6","Count only dice showing the chosen number. Example: three 4s score 12 in Fours."],three:["Three of a Kind","At least three dice show the same number. Score the total of all five dice.",[5,5,5,2,4]],four:["Four of a Kind","At least four dice show the same number. Score the total of all five dice.",[3,3,3,3,6]],full:["Full House","Three dice of one number plus two dice of another number. Scores 25 points.",[4,4,4,2,2]],small:["Small Straight","Four consecutive numbers. Scores 30 points.",[1,2,3,4,6]],large:["Large Straight","Five consecutive numbers. Scores 40 points.",[2,3,4,5,6]],five:["Five of a Kind","All five dice show the same number. Scores 50 points. Further Five of a Kind rolls add 100 points when the first one scored 50.",[6,6,6,6,6]],chance:["Chance","Any combination. Add all five dice.",[6,5,4,3,2]],zero:["Crossing out","If you cannot or do not want to score a category, choose 0. A category scored with 0 cannot be changed later."],bonus:["Upper bonus","Reach at least 63 points in the Numbers 1–6 section to receive 35 bonus points."],turns:["Players and turns","Players enter scores in turn. The app marks the active player's free fields in green and completed fields in red. The starting player rotates in the next game."]},th:{title:"เกมลูกเต๋า – วิธีเล่น",back:"← กลับไปที่เกม",intro:["เป้าหมาย","ทำคะแนนให้ได้มากที่สุด ในแต่ละตาคุณทอยลูกเต๋า 5 ลูกได้สูงสุด 3 ครั้ง หลังการทอยแต่ละครั้งสามารถเก็บลูกที่ต้องการไว้และทอยลูกที่เหลือใหม่ จากนั้นเลือกช่องคะแนนที่ยังว่าง 1 ช่อง"],upper:["เลข 1–6","นับเฉพาะลูกเต๋าที่ออกเลขที่เลือก ตัวอย่างเช่น เลข 4 จำนวน 3 ลูก ได้ 12 คะแนนในช่องเลข 4"],three:["ตอง","มีลูกเต๋าอย่างน้อย 3 ลูกที่เหมือนกัน คะแนนคือผลรวมของลูกเต๋าทั้ง 5 ลูก",[5,5,5,2,4]],four:["สี่เหมือน","มีลูกเต๋าอย่างน้อย 4 ลูกที่เหมือนกัน คะแนนคือผลรวมของลูกเต๋าทั้ง 5 ลูก",[3,3,3,3,6]],full:["ฟูลเฮาส์","เลขหนึ่งเหมือนกัน 3 ลูก และอีกเลขหนึ่งเหมือนกัน 2 ลูก ได้ 25 คะแนน",[4,4,4,2,2]],small:["สเตรทเล็ก","เลขเรียงกัน 4 ตัว ได้ 30 คะแนน",[1,2,3,4,6]],large:["สเตรทใหญ่","เลขเรียงกัน 5 ตัว ได้ 40 คะแนน",[2,3,4,5,6]],five:["ห้าเหมือน","ลูกเต๋าทั้ง 5 ลูกเป็นเลขเดียวกัน ได้ 50 คะแนน ถ้าห้าเหมือนครั้งแรกได้ 50 ครั้งต่อไปเพิ่มครั้งละ 100 คะแนน",[6,6,6,6,6]],chance:["รวมแต้ม","ใช้ลูกเต๋าแบบใดก็ได้ แล้วรวมแต้มลูกเต๋าทั้ง 5 ลูก",[6,5,4,3,2]],zero:["ตัดช่อง","ถ้าไม่สามารถหรือไม่ต้องการลงคะแนนในช่องใด ให้เลือก 0 เมื่อใส่ 0 แล้วจะเปลี่ยนช่องนั้นภายหลังไม่ได้"],bonus:["โบนัสส่วนบน","ถ้าคะแนนรวมช่องเลข 1–6 อย่างน้อย 63 คะแนน จะได้โบนัสเพิ่ม 35 คะแนน"],turns:["ผู้เล่นและลำดับ","ผู้เล่นลงคะแนนสลับกัน แอปจะแสดงช่องว่างของผู้เล่นที่กำลังเล่นด้วยกรอบสีเขียว และช่องที่ใช้แล้วด้วยกรอบสีแดง เกมถัดไปจะเปลี่ยนผู้เริ่มเล่น"]}};
function render(l){localStorage.diceLang=l;document.documentElement.lang=l;let r=R[l];title.textContent=r.title;back.textContent=r.back;let keys=["intro","upper","three","four","full","small","large","five","chance","zero","bonus","turns"];content.innerHTML=keys.map(k=>'<section class="rule"><h2>'+r[k][0]+'</h2><p>'+r[k][1]+'</p>'+(r[k][2]?ds(r[k][2]):'')+'</section>').join('')}let theme=localStorage.diceTheme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.classList.toggle("dark",theme==="dark");en.onclick=()=>render("en");th.onclick=()=>render("th");render(localStorage.diceLang||((navigator.language||"en").startsWith("th")?"th":"en"));
</script></body></html>
