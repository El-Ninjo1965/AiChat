<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b67"><title>Games · Dice Game</title><link rel="stylesheet" href="style.css"></head><body><header class="subHeader"><div class="brand"><h1>Dice Game</h1><small>Created by: L</small></div><nav><a class="navBtn" href="index.html">Game</a><a class="navBtn" href="records.html">Records</a></nav></header><main><h2>Games</h2><div id="gamesList" class="historyList">Loading…</div></main><script>fetch("api/game.php?action=results").then(r=>r.json()).then(j=>{const e=document.getElementById("gamesList");if(!j.ok||!j.games.length){e.textContent="No completed games yet.";return}e.innerHTML=j.games.map(g=>'<article class="historyCard"><b>'+new Date(g.played_at.replace(" ","T")).toLocaleString()+'</b><div>Winner: <strong>'+esc(g.winner)+'</strong> · '+g.winning_score+' points · '+g.mode+'</div><div>'+g.players.map(p=>esc(cpuLabel(p))+': '+Number(p.score||0)).join(" · ")+'</div></article>').join("")}).catch(()=>gamesList.textContent="Could not load games.");function cpuLabel(p){let n={beginner:"Beginner",normal:"Normal",expert:"Expert"}[String(p&&p.cpu_level||"").toLowerCase()];return p&&p.name==="Computer"&&n?"Computer – "+n:p&&p.name||""}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}</script></body></html>
