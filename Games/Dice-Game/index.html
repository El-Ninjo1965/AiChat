<!doctype html><html lang="en" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b67"><title>Dice Game</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head><body><div id="prestart" class="prestart"><div class="prestartCard"><h2>Who is playing?</h2><button id="continueAs" class="continueAs" type="button" hidden></button><div class="prestartChoices"><button data-profile="l">L</button><button data-profile="pat">Pat</button><button data-profile="guest">Guest</button></div><div id="authBox" class="customStart" hidden><input id="authPassword" type="password" minlength="4" placeholder="Password"><button id="authSubmit">Continue</button></div><div class="customStart"><input id="startName" maxlength="40" placeholder="Your name"><button id="startCustom">Start</button></div></div></div><header><div class="brand topBrand"><h1><span data-t="title">Dice Game</span></h1><small>Created by: L</small></div><div class="theme"><button id="light">☀ Light</button><button id="dark">☾ Dark</button><button class="infoBtn" id="infoView">ⓘ Info</button><button id="gameView" data-ui="game">Game</button><button id="diceMode" data-ui="dice">🎲 Dice</button><button id="onlineMode" data-ui="online">⇄ Online</button><button id="lobbyView" data-ui="lobby">👥 Lobby</button><button id="gamesView" data-ui="games">Games</button><button id="recordsView" data-ui="records">Records</button><button id="soundToggle" class="alertToggle" type="button" aria-pressed="true">🔊</button><button id="vibeToggle" class="alertToggle" type="button" aria-pressed="true" hidden>📳</button><button id="logoutBtn" data-ui="logout" hidden>Logout</button></div><div class="language"><button id="installApp" data-ui="install" type="button" hidden>⤓ Install app</button><but
